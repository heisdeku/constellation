<!--
  Source artwork for the app icon.

  macOS geometry: an 824x824 squircle centred in a 1024x1024 canvas, leaving a
  100px transparent margin so it sits correctly beside other Dock icons.

  Render it with a rasteriser that preserves alpha — `qlmanage` does NOT, it
  composites onto a white matte:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --force-device-scale-factor=1 \
      --default-background-color=00000000 --window-size=1024,1024 \
      --screenshot=icon.png file://$PWD/docs/icon.svg

  Then regenerate every size with: pnpm tauri icon icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#222b3a"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0.15" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>

  <!-- A port, listening: signal arcs radiating from a bound socket. -->
  <g transform="translate(336 688)">
    <circle cx="0" cy="0" r="45" fill="url(#accent)"/>
    <g fill="none" stroke="url(#accent)" stroke-width="47" stroke-linecap="round">
      <path d="M0 -158 A158 158 0 0 1 158 0" opacity="0.95"/>
      <path d="M0 -266 A266 266 0 0 1 266 0" opacity="0.62"/>
      <path d="M0 -374 A374 374 0 0 1 374 0" opacity="0.32"/>
    </g>
  </g>
</svg>
