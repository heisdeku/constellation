[package]
name = "mare"
version = "0.1.0"
description = "See what is running on your Mac and what is filling its disk."
authors = ["Oluwaferanmi Adedokun"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
